<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提醒</title>
<link rel="stylesheet" href="alert.css">
</head>
<body>
<div id="toastcard">
  <div class="t-head">
    <span id="t-title">股价提醒</span>
    <button id="t-close" title="关闭">×</button>
  </div>
  <div id="t-body">—</div>

</div>
<script src="alert.js"></script>
</body>
</html>
